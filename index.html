<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Instansi Medis Glory IX</title>

<style>
body{
    margin:0;
    font-family: Arial, Helvetica, sans-serif;
    background: linear-gradient(135deg,#0f2027,#203a43,#2c5364);
    color:white;
}

header{
    text-align:center;
    padding:25px;
    font-size:28px;
    font-weight:bold;
    background: rgba(0,0,0,0.4);
}

.container{
    max-width:600px;
    margin:30px auto;
    background: rgba(255,255,255,0.1);
    padding:25px;
    border-radius:15px;
}

h2{
    text-align:center;
}

input, select, textarea{
    width:100%;
    padding:10px;
    margin-top:10px;
    margin-bottom:15px;
    border-radius:8px;
    border:none;
}

button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:8px;
    background:#00e0ff;
    font-weight:bold;
    cursor:pointer;
}

.success{
    text-align:center;
    margin-top:15px;
    color:#00ff88;
    display:none;
}
</style>
</head>

<body>

<header>
INSTANSI MEDIS GLORY IX
</header>

<div class="container">

<h2>Form Pelayanan</h2>

<form id="formGlory">

<label>Nama Lengkap</label>
<input type="text" required>

<label>Nomor Telepon</label>
<input type="text" required>

<label>Pilih Layanan</label>
<select required>
<option value="">-- Pilih --</option>
<option>Pembuatan SKS</option>
<option>Konsultasi</option>
<option>Operasi</option>
<option>Pelayanan Umum</option>
</select>

<label>Keterangan / Keluhan</label>
<textarea rows="4"></textarea>

<button type="submit">Kirim Permohonan</button>

</form>

<div class="success" id="successMsg">
Permohonan berhasil dikirim ✔
</div>

</div>

<script>
document.getElementById("formGlory").addEventListener("submit", function(e){
    e.preventDefault();
    document.getElementById("successMsg").style.display = "block";
});
</script>

</body>
